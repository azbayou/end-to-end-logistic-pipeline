<style>
  :root {
    --bg: #f1f5f9;
    --surface: #ffffff;
    --surface-subtle: #f8fafc;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --text-muted: #475569;
    --text-faint: #64748b;
    --header-bg: #0f172a;
    --header-text: #f8fafc;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-soft: #eff6ff;
    --success: #059669;
    --success-soft: #ecfdf5;
    --warning: #d97706;
    --warning-soft: #fffbeb;
    --danger: #dc2626;
    --danger-soft: #fef2f2;
    --indigo: #4f46e5;
    --indigo-soft: #eef2ff;
    --radius: 10px;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 4px 14px rgba(15, 23, 42, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }

  .hidden {
    display: none !important;
  }

  /* Header & Navigation */
  .app-header {
    background: var(--header-bg);
    color: var(--header-text);
    position: sticky;
    top: 0;
    z-index: 40;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.16);
  }

  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 12px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.04em;
    color: #fff;
  }

  .brand-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .brand-sub {
    font-size: 12px;
    color: #94a3b8;
    margin: 0;
  }

  .nav-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .nav-btn {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.06);
    color: #cbd5e1;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .nav-btn:hover {
    background: rgba(255, 255, 255, 0.14);
    color: #ffffff;
  }

  .nav-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #ffffff;
  }

  .nav-count {
    background: rgba(15, 23, 42, 0.35);
    color: #e2e8f0;
    border-radius: 999px;
    padding: 1px 7px;
    font-size: 11px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* Buttons */
  .btn {
    appearance: none;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    padding: 7px 13px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn:hover:not(:disabled) {
    background: var(--surface-subtle);
    border-color: #94a3b8;
  }

  .btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #ffffff;
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--primary-hover);
    border-color: var(--primary-hover);
  }

  .btn-success {
    background: var(--success);
    border-color: var(--success);
    color: #ffffff;
  }

  .btn-success:hover:not(:disabled) {
    background: #047857;
  }

  .btn-warning {
    background: var(--warning);
    border-color: var(--warning);
    color: #ffffff;
  }

  .btn-warning:hover:not(:disabled) {
    background: #b45309;
  }

  .btn-danger {
    background: var(--danger);
    border-color: var(--danger);
    color: #ffffff;
  }

  .btn-danger:hover:not(:disabled) {
    background: #b91c1c;
  }

  .btn-ghost-dark {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.2);
    color: #f8fafc;
  }

  .btn-ghost-dark:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.2);
  }

  .btn-sm {
    padding: 4px 10px;
    font-size: 12px;
    border-radius: 6px;
  }

  /* Main Container */
  .main-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
  }

  .page-heading {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }

  .page-heading h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
  }

  .page-heading p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--text-muted);
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 16px;
    margin-bottom: 16px;
  }

  .card-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .card-title {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  .card-sub {
    font-size: 12px;
    color: var(--text-faint);
  }

  /* KPI Grid */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }

  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
    border-top: 3px solid var(--primary);
  }

  .kpi-card.kpi-success { border-top-color: var(--success); }
  .kpi-card.kpi-indigo { border-top-color: var(--indigo); }
  .kpi-card.kpi-danger { border-top-color: var(--danger); }
  .kpi-card.kpi-warning { border-top-color: var(--warning); }

  .kpi-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .kpi-value {
    margin-top: 6px;
    font-size: 26px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    line-height: 1.15;
  }

  .kpi-meta {
    margin-top: 4px;
    font-size: 12px;
    color: var(--text-faint);
  }

  /* Filter & Form Controls */
  .filter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    align-items: end;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .form-group.full-span {
    grid-column: 1 / -1;
  }

  label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
  }

  input[type="text"],
  input[type="search"],
  input[type="date"],
  select,
  textarea {
    width: 100%;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    background: var(--surface);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
  }

  .preview-box {
    background: var(--surface-subtle);
    border: 1px dashed var(--border-strong);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--text-muted);
  }

  /* Charts Grid */
  .charts-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 16px;
  }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .chart-card.wide {
    grid-column: span 2;
  }

  .chart-box {
    width: 100%;
    min-height: 210px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .chart-box svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    display: inline-block;
    flex-shrink: 0;
  }

  .seg-group {
    display: inline-flex;
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    overflow: hidden;
  }

  .seg-btn {
    border: none;
    background: var(--surface);
    color: var(--text-muted);
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .seg-btn.active {
    background: var(--primary);
    color: #fff;
  }

  /* Sub-tabs (Sort view) */
  .sub-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }

  .sub-tab-btn {
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-muted);
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .sub-tab-btn.active {
    background: var(--indigo);
    border-color: var(--indigo);
    color: #ffffff;
  }

  /* Action Bar */
  .ops-toolbar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 10px;
    align-items: end;
    margin-bottom: 12px;
  }

  .ops-actions-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  /* Tables */
  .table-wrap {
    width: 100%;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    background: var(--surface);
  }

  th,
  td {
    padding: 9px 11px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  thead th {
    background: var(--surface-subtle);
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  tbody tr:hover {
    background: #f8fafc;
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
  }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }

  .badge-pending { background: #fef3c7; color: #92400e; }
  .badge-transit { background: #dbeafe; color: #1e40af; }
  .badge-shipment { background: #e0e7ff; color: #3730a3; }
  .badge-delivered { background: #d1fae5; color: #065f46; }
  .badge-returned { background: #fee2e2; color: #991b1b; }
  .badge-under-sla { background: #dcfce7; color: #166534; }
  .badge-over-sla { background: #fee2e2; color: #991b1b; }
  .badge-not-inbounded { background: #f1f5f9; color: #475569; }
  .badge-rts { background: #ffedd5; color: #9a3412; margin-left: 4px; }

  /* Alerts & Toasts */
  .form-error {
    background: var(--danger-soft);
    border: 1px solid #fecaca;
    color: #991b1b;
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 12px;
  }

  #toast-container {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 90;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 400px;
  }

  .toast {
    background: #0f172a;
    color: #f8fafc;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow-md);
    border-left: 4px solid var(--primary);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .toast.toast-success { border-left-color: var(--success); }
  .toast.toast-error { border-left-color: var(--danger); background: #7f1d1d; }
  .toast.toast-warning { border-left-color: var(--warning); }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    z-index: 80;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .modal-card {
    background: var(--surface);
    border-radius: 12px;
    box-shadow: 0 20px 40px rgba(15, 23, 42, 0.25);
    max-width: 540px;
    width: 100%;
    padding: 20px;
  }

  .modal-title {
    margin: 0 0 8px;
    font-size: 17px;
    font-weight: 700;
  }

  .modal-body {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .modal-list {
    max-height: 180px;
    overflow-y: auto;
    background: var(--surface-subtle);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    margin-top: 8px;
    font-size: 12px;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .empty-state {
    text-align: center;
    padding: 24px 12px;
    color: var(--text-faint);
    font-size: 13px;
  }

  @media (max-width: 1100px) {
    .kpi-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .charts-grid {
      grid-template-columns: 1fr;
    }
    .chart-card.wide {
      grid-column: span 1;
    }
  }

  @media (max-width: 720px) {
    .form-grid {
      grid-template-columns: 1fr;
    }
    .kpi-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
